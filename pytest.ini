[pytest]
testpaths = web/tests mobile/tests
python_files = test_*.py
addopts =
    --alluredir=allure-results
    --clean-alluredir
    -v
markers =
    web: test suite Playwright
    mobile: test suite Maestro
    tier1: assertion Tier 1 - navigasi/tampilan
    tier2: assertion Tier 2 - verifikasi data field-by-field
    negative: assertion Negative - pesan error spesifik
