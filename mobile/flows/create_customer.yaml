# =============================================================================
# TC-MOB-002 - Create customer di eWork SFA
#
# Assertion Tier 2: memverifikasi record ADA dan NILAINYA sama dengan input.
# Brief menyatakan toast sukses saja tidak cukup.
#
# Data customer dilewatkan sebagai variabel oleh wrapper Pytest, yang
# mengambilnya dari modul AI (Phase 3A). Tidak ada nilai yang di-hardcode.
#
# STRUKTUR FORM (hasil inspeksi maestro hierarchy):
#   Outlet Name*    noo_registration_input_outlet_name
#   Phone No*       noo_registration_input_phone      (prefix +62 terpisah)
#   Email           noo_registration_input_email      (TANPA tanda *, opsional)
#   Contact Person* noo_registration_input_contact_person
# =============================================================================
appId: ${EWORK_APP_ID}
---
- runFlow: shared/login.yaml

# Tunggu dashboard termuat setelah login.
- extendedWaitUntil:
    visible:
      text: "New Customer"
    timeout: 60000

- tapOn:
    text: "New Customer"

# Daftar customer memuat datanya lewat jaringan, jadi tombol tambah baru
# muncul beberapa saat kemudian. Timeout 30 detik terbukti kurang - flow
# gagal dengan "Assertion is false" padahal halamannya memang sedang memuat.
- extendedWaitUntil:
    visible:
      id: "id.edot.ework:id/noo_label_add_new_cust"
    timeout: 90000

- tapOn:
    id: "id.edot.ework:id/noo_label_add_new_cust"

# Tunggu form benar-benar siap sebelum mengetik.
- extendedWaitUntil:
    visible:
      id: "id.edot.ework:id/noo_registration_input_outlet_name"
    timeout: 60000

# ---------- Isi form ----------

- tapOn:
    id: "id.edot.ework:id/noo_registration_input_outlet_name"
- inputText: ${CUSTOMER_NAME}

- tapOn:
    id: "id.edot.ework:id/noo_registration_input_phone"
- inputText: ${CUSTOMER_PHONE}

- tapOn:
    id: "id.edot.ework:id/noo_registration_input_email"
- inputText: ${CUSTOMER_EMAIL}

- tapOn:
    id: "id.edot.ework:id/noo_registration_input_contact_person"
- inputText: ${CUSTOMER_CONTACT_PERSON}

- hideKeyboard

# ---------- Tier 2: verifikasi nilai yang benar-benar masuk ----------
#
# Diverifikasi SEBELUM submit karena form ini bertahap, dan langkah
# berikutnya belum diinspeksi. Membaca balik nilai di field membuktikan
# input benar-benar diterima aplikasi - bukan sekadar diketik lalu hilang.
#
# assertVisible dengan teks PERSIS: bila aplikasi memotong, mengubah, atau
# tidak menerima nilainya, assertion ini gagal.

- assertVisible:
    id: "id.edot.ework:id/noo_registration_input_outlet_name"
    text: ${CUSTOMER_NAME}

- assertVisible:
    id: "id.edot.ework:id/noo_registration_input_phone"
    text: ${CUSTOMER_PHONE}

- assertVisible:
    id: "id.edot.ework:id/noo_registration_input_contact_person"
    text: ${CUSTOMER_CONTACT_PERSON}