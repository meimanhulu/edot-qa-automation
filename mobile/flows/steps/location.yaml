# Postal code terisi OTOMATIS setelah Sub district dipilih.

# ---------- Tier 2: Continue aktif ----------
#
# Address Type dan Address sudah diverifikasi di tempat, tepat setelah diisi.
# Nilai cascade ditentukan aplikasi saat runtime sehingga tidak ada expected
# value untuk dibandingkan - yang dibuktikan adalah keempatnya terisi,
# ditandai oleh tombol Continue yang menjadi aktif.
- scrollUntilVisible:
    element:
      id: "id.edot.ework:id/noo_registration_action_continue"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 40
    waitToSettleTimeoutMs: 1500
    centerElement: true

- assertVisible:
    id: "id.edot.ework:id/noo_registration_action_continue"
    enabled: true

- tapOn:
    id: "id.edot.ework:id/noo_registration_action_continue"