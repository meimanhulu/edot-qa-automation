# =============================================================================
# SHARED SUB-FLOW: login
#
# Dipanggil flow lain lewat runFlow - brief mensyaratkan apa pun yang dipakai
# ulang, terutama login, diekstrak jadi sub-flow bersama.
#
# Kredensial TIDAK di-hardcode. Dilewatkan sebagai environment variable oleh
# wrapper Pytest (mobile/runner.py), yang membacanya dari .env.
#
# SELECTOR: aplikasi ini menyediakan resource-id yang bersih dan stabil -
# prioritas PERTAMA pada urutan brief (id > id regex > text > accessibilityText
# > composite > point). Tidak ada tap koordinat sama sekali.
# =============================================================================
appId: ${EWORK_APP_ID}
---
- launchApp:
    clearState: true

# Tunggu layar login siap sebelum mengetik. Tanpa ini, input pertama bisa
# hilang karena field belum ter-render.
- extendedWaitUntil:
    visible:
      id: "id.edot.ework:id/tv_company_id"
    timeout: 30000

- tapOn:
    id: "id.edot.ework:id/tv_company_id"
- inputText: ${EWORK_COMPANY_ID}

- tapOn:
    id: "id.edot.ework:id/tv_username"
- inputText: ${EWORK_USERNAME}

- tapOn:
    id: "id.edot.ework:id/tv_password"
- inputText: ${EWORK_PASSWORD}

# Tutup keyboard supaya tombol Sign In tidak tertutup.
- hideKeyboard

- tapOn:
    id: "id.edot.ework:id/btn_signin"